<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <style>
    :root {
      --text: #232333;
      --muted: #6e6e7a;
      --line: #e1e1e6;
      --border: #c8c8d0;
      --blue: #0b6bde;
      --blue-hover: #0a5ec2;
      --focus: #4f9bf0;
      --error: #d93025;
      --radius: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system,
        "Helvetica Neue", Arial, sans-serif;
    }

    body {
      border-top: 1px solid var(--line);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      text-align: center;
    }

    .login__title {
      margin: 0 0 32px;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    /* ---------- Input fields ---------- */

    .field {
      display: block;
      padding: 10px 14px;
      margin-bottom: 12px;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: text;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field:focus-within {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(79, 155, 240, 0.25);
    }

    .field[data-invalid="true"] {
      border-color: var(--error);
      box-shadow: none;
    }

    .field__label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .field__input {
      display: block;
      width: 100%;
      height: 24px;
      padding: 0;
      margin-top: 2px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    .login__error {
      margin: 6px 4px 0;
      text-align: left;
      color: var(--error);
      font-size: 13px;
    }

    /* ---------- Primary button ---------- */

    .btn-primary {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--blue-hover);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: progress;
    }

    /* ---------- Divider ---------- */

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 32px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ---------- Google button ---------- */

    .social {
      display: flex;
      justify-content: center;
    }

    .social__btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .social__icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      transition: background 0.15s, border-color 0.15s;
    }

    .social__btn:hover .social__icon {
      background: #f6f7f9;
      border-color: #d0d0d8;
    }

    /* ---------- Login + footer ---------- */

    .login__register {
      margin: 28px 0 0;
      font-size: 15px;
      color: var(--muted);
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login__footer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
      font-size: 14px;
    }

    /* ---------- Keyboard focus ---------- */

    .btn-primary:focus-visible,
    .social__btn:focus-visible .social__icon,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }


    /* ---------- Verification step ---------- */

    .verify__text {
      margin: -16px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .verify__text strong {
      color: var(--text);
      word-break: break-all;
    }

    .code-input {
      font-size: 24px !important;
      height: 34px !important;
      letter-spacing: 0.4em;
      text-align: center;
    }

    .verify__info {
      margin: 10px 4px 0;
      text-align: left;
      color: var(--muted);
      font-size: 13px;
    }

    .verify__info:empty,
    .login__error:empty {
      display: none;
    }

    .verify__actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 24px;
      font-size: 14px;
    }

    .link-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue);
      font: inherit;
      cursor: pointer;
    }

    .link-btn:hover:not(:disabled) {
      text-decoration: underline;
    }

    .link-btn:disabled {
      color: var(--muted);
      cursor: default;
    }

    /* ---------- Small screens ---------- */

    @media (max-width: 520px) {
      .login__title {
        font-size: 30px;
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="login">

    <div id="register-step">

    <h2 class="login__title">Create your account</h2>

    <form id="register-form" class="login__form" novalidate>

      <label class="field" for="fullname">
        <span class="field__label">Full name</span>
        <input
          class="field__input"
          id="fullname"
          name="fullname"
          type="text"
          autocomplete="name"
          required>
      </label>

      <label class="field" for="username">
        <span class="field__label">Username</span>
        <input
          class="field__input"
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required>
      </label>

      <label class="field" for="email">
        <span class="field__label">Email address</span>
        <input
          class="field__input"
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required>
      </label>

    <label class="field" for="password">
        <span class="field__label">Password</span>
        <input
        class="field__input"
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
            required>
    </label>

      <button
        id="register-btn"
        class="btn-primary"
        type="submit">
        Register
      </button>

    </form>

    <div class="divider">
      <span>Or register with</span>
    </div>

    <div class="social">
      <button id="google-btn" class="social__btn" type="button">
        <span class="social__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="22" height="22">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        <span class="social__label">Google</span>
      </button>
    </div>

    <p class="login__register">
      Already have an account?
      <a href="login.html">Sign in here</a>
    </p>

    </div>

    <section id="verify-step" hidden>
      <h2 class="login__title">Check your email</h2>
      <p class="verify__text">
        We sent a verification code to <strong id="verify-email"></strong>.
        Enter it below to verify your account.
      </p>

      <form id="verify-form" novalidate>
        <label class="field" for="code">
          <span class="field__label">Verification code</span>
          <input
            class="field__input code-input"
            id="code"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="8"
            pattern="[0-9]*"
            required>
        </label>
        <p id="verify-error" class="login__error" role="alert"></p>
        <p id="verify-info" class="verify__info" aria-live="polite"></p>

        <button id="verify-btn" class="btn-primary" type="submit">Verify</button>
      </form>

      <div class="verify__actions">
        <button id="resend-btn" class="link-btn" type="button">Resend code</button>
        <button id="change-email-btn" class="link-btn" type="button">Use a different email</button>
      </div>
    </section>

    <nav class="login__footer" aria-label="Footer">
      <a href="#">Help</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </nav>

  </main>

  <script type="module" src="register.js"></script>
</body>
</html>
