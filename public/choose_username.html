<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Choose a username</title>
  <style>
    :root {
      --text: #232333;
      --muted: #6e6e7a;
      --line: #e1e1e6;
      --border: #c8c8d0;
      --blue: #0b6bde;
      --blue-hover: #0a5ec2;
      --focus: #4f9bf0;
      --error: #d93025;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    body { border-top: 1px solid var(--line); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login { width: 100%; max-width: 400px; padding: 24px 20px; text-align: center; }
    .login__title { margin: 0 0 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
    .login__text { margin: 0 0 28px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .field { display: block; padding: 10px 14px; text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius); cursor: text; transition: border-color 0.15s, box-shadow 0.15s; }
    .field:focus-within { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(79, 155, 240, 0.25); }
    .field__label { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
    .field__input { display: block; width: 100%; height: 24px; padding: 0; margin-top: 2px; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; }
    .login__error { margin: 8px 4px 0; text-align: left; color: var(--error); font-size: 13px; }
    .login__error:empty { display: none; }
    .btn-primary { display: block; width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: var(--radius); background: var(--blue); color: #fff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-primary:disabled { opacity: 0.65; cursor: progress; }
    .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="login">
    <h2 class="login__title">Choose a username</h2>
    <p class="login__text">Your account is ready. Pick the username other people will see in meetings.</p>

    <form id="username-form" novalidate>
      <label class="field" for="username">
        <span class="field__label">Username</span>
        <input class="field__input" id="username" name="username" type="text" autocomplete="username" autofocus required>
      </label>
      <p id="username-error" class="login__error" role="alert"></p>
      <button id="save-btn" class="btn-primary" type="submit">Continue</button>
    </form>
  </main>

  <script type="module" src="choose-username.js"></script>
</body>
</html>
